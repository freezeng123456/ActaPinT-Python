name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  numerical-smoke-tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: matrix.python-version == '3.10'
        run: python -m pip install -e ".[test]"
      - if: matrix.python-version == '3.12'
        run: python -m pip install -c constraints-reproduction.txt -e ".[test]"
      - run: python -m pytest
      - run: python run_experiments.py stmg_fem_3d --quick --output-dir results/ci-stmg
